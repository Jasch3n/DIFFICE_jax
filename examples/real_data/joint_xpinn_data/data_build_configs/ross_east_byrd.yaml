# Ross Ice Shelf (East) + Byrd Glacier grounding zone, 100km upstream
# buffer. `iceshelves_2008_v2.mat` splits Ross into "Ross East"/"Ross
# West" rather than one "Ross" polygon — Byrd's basin touches Ross East
# directly (distance 0m via boundaries.get_named_polygon(...).distance(...))
# and is ~280km from Ross West, so Ross East is the correct shelf here.
#
# compare_sources (buffer_km=100) shows reasonable GL agreement
# (measures_boundaries_2008 vs bedmachine_mask: median ~420-1195m, similar
# order to Amery). The calving-front sources also now agree at the front
# (velocity_mask -> bedmachine median ~4km) after fixing velocity_mask to
# restrict its valid-coverage blob to the named shelf and count only the
# outer ocean as no-data — before that fix it returned the continent-wide
# velocity-coverage edge (~625km median disagreement) given Ross East's
# huge ~674km x 922km bounding box. See ../HANDOFF.md. Still using the
# recommended bedmachine_mask default for the front (velocity_mask covers
# only the velocity-imaged portion of the arc; bedmachine covers all of
# it).

ice_shelf: Ross East
grounding_zone: Byrd
buffer_km: 100

# Opt into domain.process_flow_restricted (GL flow-filtering, a velocity-
# thresholded grounded corridor, near-interface smoothing) — Byrd needs
# all of it; Amery's configs never set this and use the "simple" default.
# min_speed_myr isolates Byrd's own fast trunk from its basin's much
# wider (~76km, real speeds 2-832 m/yr median 170) geometric interface —
# 500.0 matches its known ~20km confluence width and published ~800-900
# m/yr near-GL speed. corridor_margin_km additionally constrains the
# grounded region's width near the interface to roughly this many km
# beyond the flow-filtered grounding line's own extent (oriented via real
# velocity direction) — needed because grounded_polygon = buffer(gl,
# buffer_km) ∩ basin_polygon stayed ~100-140km wide even after
# min_speed_myr narrowed gl, since buffer_km=100 is generous enough that
# basin_polygon's own shape dominates the intersection regardless
# (confirmed via utils.raster_utils.boundary_sharpness — a grid search
# over every floating-corridor taper parameter left this specific
# corner's sharpness unchanged, ruling out the floating side as the
# cause). The strategy also uses min_speed_myr as
# floating_region_kwargs' min_normal_velocity_myr default below, so the
# two never need to be set separately — see
# docs/adr/0002-shelf-class-region-strategy-registry.md and HANDOFF.md.
region_strategy: flow_restricted
region_strategy_kwargs:
  min_speed_myr: 500.0
  corridor_margin_km: 15.0

# BedMachine v3 for thickness (no BEDMAP1/2 concat here yet, unlike the
# Amery configs) and for surface elevation — both the default, set
# explicitly for reproducibility. As a dense grid, BedMachine feeds both
# the dense (h_dense/s_dense) and sparse (hd/sd) roles resampled onto the
# velocity grid (xd_h==xd_s==xd) — see build_dataset.
thickness_source: bedmachine_v3
surface_source: bedmachine_v3

# Ross East is fed by many outlet glaciers besides Byrd — the whole_shelf
# default (shelf polygon minus the grounded corridor, same as every Amery
# config) would make the floating region the entire eastern Ross Ice
# Shelf, ~99% of it unrelated to Byrd's actual flow (confirmed visually:
# Byrd's discharge fan is one small corner of the shelf). Restrict to a
# corridor around just Byrd's own flow instead — traces forward
# streamlines from Byrd's flux-gate seeds until they leave the shelf
# polygon (naturally reaching the real calving front, not truncated
# early), then buffers by margin_km. See ../floating_region.py.
floating_region_source: flowline_corridor
floating_region_kwargs:
  # Uniform (constant-width) corridor: taper_km=0 disables the ramp so the
  # buffer is a flat margin_km everywhere, no widening from the grounding
  # line to the calving front. Byrd's traced streamlines are a coherent
  # bundle that barely fans out, so a flat margin gives a clean, smooth
  # tube around the flow — whereas the earlier tapered 2->15km buffer
  # widened enough downstream to reach the shelf-polygon boundary and a
  # secondary flow lobe, producing a sharp kink at the end of the widening
  # that no taper profile or edge-smoothing could fix (a taper only shapes
  # the first taper_km from the GL; the kink was far beyond that). See
  # ../HANDOFF.md. margin_km=8 captures Byrd's discharge fan with a modest
  # margin; raise/lower it to include more/less shelf around the flow.
  margin_km: 8.0
  taper_km: 0.0
  # min_normal_velocity_myr is NOT set here — process_flow_restricted
  # derives it from region_strategy_kwargs.min_speed_myr above (see
  # ../domain.py), so it can't drift out of sync the way a hand-set
  # duplicate value could.

# Resample the (ordered, measures_boundaries_2008 default) grounding line
# so no two consecutive points are more than 500m apart — same rationale
# as the Amery configs (see ../HANDOFF.md).
grounding_line_resample_m: 500.0

# Exclude near-stagnant grounded ice (e.g. near the ice divide) from the
# grounded region's training data — only keep points flowing faster than
# this. Byrd is one of Antarctica's fastest outlet glaciers, but its
# 100km upstream buffer may still reach into slower ice near a divide.
grounded_min_speed_myr: 100.0

# Collocation library (xcol/ycol): an independent, density-controlled Halton
# sample instead of reusing the velocity data points. A per-region [grounded,
# floating] pair, not a single scalar like the Amery configs — Byrd's
# flow-filtered grounded corridor (~2492 km^2, 6813 velocity points, a
# density of ~2.73 pts/km^2) is far sparser than its floating region
# (~22435 km^2, 110684 velocity points, ~4.93 pts/km^2), so one shared
# density would overshoot one region or undershoot the other by ~1.8x.
# interface_density matches density (no near-interface boost) since the
# goal here is just to track each region's own real velocity-point density.
# See utils/collocation.py.
collocation:
  density: [2.73, 4.93]  # pts/km^2 (grounded, floating)
