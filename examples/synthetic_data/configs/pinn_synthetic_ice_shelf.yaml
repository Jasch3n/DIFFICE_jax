name: pinn_synthetic_ice_shelf
workflow: ice-shelf-only

data:
  source: ../../tests/data_pinns_test.mat
  sampling_counts:
    velocity_data: 1024
    thickness_data: 1024
    # Floating standalone PINN has no independent surface-elevation data term.
    surface_data: null
    collocation: 2048
    calving_front: 256
  collocation_library_size: full

model:
  workflow: pinn
  network:
    depth: 6
    width: 30

equation:
  name: ssa_iso

loss:
  name: iso
  weights: [1.0, 0.05, 0.1]

training:
  seed: 1234
  stages:
    - optimizer:
        name: adam
        learning_rate: 1.0e-3
      iterations: 5000

artifacts:
  output_dir: ../../tests/figures/ice_shelf_only__{tag}/solver
