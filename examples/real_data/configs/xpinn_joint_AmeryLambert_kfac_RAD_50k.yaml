# Amery / Lambert joint inversion (real data), CPU.
# KFAC, 50k iterations, RAD adaptive collocation sampling, no gPINN.
# Collocation points per step: 500 (grounded) / 1500 (floating).
# Data: joint_xpinn_data build with the two-tier collocation library enabled.
name: xpinn_joint_AmeryLambert_kfac_RAD_50k
workflow: joint_inversion

runtime:
  jax_platform: cpu

data:
  source: ../joint_xpinn_data/output/sparse_bedmap/Amery_Lambert_100km/Amery_Lambert_100km.mat
  # gPINN is off, so interface_collocation is unused; kept for schema/parity.
  interface_collocation:
    library_size: 600
    sample_count: 600
  sampling_counts:
    velocity_data: [1028, 1028]
    thickness_data: [1028, 1028]
    # Surface data is sampled independently from thickness data, without
    # replacement, so the count must not exceed a region's own surface-point
    # count. The grounded region has only ~640 (sparse BEDMAP1 coverage), so
    # its count is capped below that.
    surface_data: [512, 1028]
    # Collocation points drawn from each region's library per step:
    # [grounded, floating]. The build's libraries (~1015 / ~9322 points for
    # Amery/Lambert) are large enough for these counts.
    collocation: [500, 1500]
    calving_front: [500, 500]
    matching: 500

model:
  workflow: xpinn
  regions:
    - index: 0
      kind: grounded
    - index: 1
      kind: floating
  network:
    depth: 6
    width: 30

equation:
  name: ssa_iso

loss:
  name: joint_inversion
  matching: true
  calving_front: true
  use_gpinn: false
  active_regions: [0, 1]

training:
  seed: 8132002
  global_weights:
    data: 1.0
    equation: 0.01
    calving_front: 0.05
    matching: 1.0
    gpinn: 0.0
    mu_gradient: 0.0
  stages:
    - optimizer:
        name: kfac
        learning_rate: null
        damping: .nan
        parameters:
          preset: xpinn_joint_inversion_reference
          log_rate: 200
          interface_points: all
          active_regions: [0, 1]
      iterations: 50000
      adaptive_sampling: true
      adaptive_sampling_burn_in: 1500
      adaptive_sampling_period: 50

artifacts:
  output_dir: ../AmeryLambert_kfac_RAD_50k
