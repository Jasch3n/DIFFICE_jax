# Amery Ice Shelf + Lambert Glacier grounding zone, 100km upstream buffer —
# THICKNESS-SOURCE ABLATION: dense BedMachine v3 thickness.
# Identical to amery_lambert.yaml except thickness_source, to isolate the
# effect of thickness source choice on the built dataset / downstream
# inversion. See amery_lambert_thickness_bedmap.yaml for the sparse
# BEDMAP1+BEDMAP2 counterpart. Build both into separate --out-dir roots
# (same ice_shelf/grounding_zone/buffer_km => same config_stem) — see
# WORKFLOW.md.

ice_shelf: Amery
grounding_zone: Lambert
buffer_km: 100

velocity_source: measures_v2
# Thickness: BedMachine v3, a complete gridded DEM-derived product. As a
# dense grid it has no native sparse points distinct from its own grid, so
# both thickness roles (h_dense and hd) are resampled onto the velocity
# grid (xd_h==xd) — see data_sources/thickness.py and build_dataset.py.
thickness_source: bedmachine_v3
# Surface elevation: BedMachine v3 (a complete gridded DEM). Feeds both
# s_dense and sd; as a dense grid it has no native sparse points, so sd is
# resampled onto the velocity grid too (xd_s==xd) — see build_dataset.
surface_source: bedmachine_v3
grounding_line_source: measures_boundaries_2008
calving_front_source: bedmachine_mask

# Restrict the grounded region to Lambert's own fast trunk so the grounded
# polygon, its grounding line, and the velocity data all coincide — under
# the "simple" default, grounded_polygon = buffer(gl, 100km) ∩ basin spans
# the full basin corridor (~100km wide, ~12,000 km^2), whose ring sat a
# median ~17.5km from the fast-ice data it was meant to bound, and whose GL
# trailed ~100km past the fast trunk that actually feeds the shelf.
#
# min_speed_myr=200 isolates Lambert's fast trunk (GL median speed is only
# 87 m/yr across the full basin interface, mean 191, max 756 — the trunk is
# the fast tail). A swept comparison of the flow-filtered GL against the
# resulting grounded corridor's boundary: at min_speed_myr=100 the GL still
# trailed a median 14.8km / max 29km past the corridor (the corridor can't
# reach every 100 m/yr GL point); at 200 with corridor_margin_km=25 they
# coincide to <500m (velocity-grid resolution), giving a ~2,000 km^2 trunk
# whose GL is genuinely its own downstream edge. See
# docs/adr/0002-shelf-class-region-strategy-registry.md.
region_strategy: flow_restricted
region_strategy_kwargs:
  min_speed_myr: 200.0
  corridor_margin_km: 25.0

# Restrict the floating region to a corridor around Lambert's own flow
# rather than the whole Amery shelf (which is fed by Lambert + Mellor +
# Fisher). Traces forward streamlines from Lambert's flux-gate seeds to the
# calving front and buffers them by margin_km. min_normal_velocity_myr is
# derived automatically from region_strategy_kwargs.min_speed_myr above
# (=200), so the corridor is seeded from the same fast trunk the grounded
# region and its GL represent. Uniform width (taper_km=0), following Byrd's
# lesson that a tapered buffer can bulge/kink downstream. See
# floating_region.py and ../HANDOFF.md.
floating_region_source: flowline_corridor
floating_region_kwargs:
  margin_km: 15.0
  taper_km: 0.0

# Resample the (ordered, measures_boundaries_2008) grounding line to an even
# arc-length spacing before use. Set fine enough (~40m over Lambert's ~25km
# flow-filtered trunk) that the reported grounding line x_md/y_md has >=500
# points, so a joint-inversion workflow can draw 500 interface-matching
# points per step (the matching sampler draws without replacement, so
# matching count <= number of x_md points). Also tightens ols_d's
# near-vertex overshoot vs the old 500m spacing (see ../HANDOFF.md).
grounding_line_resample_m: 40.0

# Exclude near-stagnant grounded ice (e.g. near the ice divide) from the
# grounded region's training data — only keep points flowing faster than
# this.
grounded_min_speed_myr: 100.0

# Collocation library (xcol/ycol): an independent, density-controlled
# two-tier Halton sample instead of reusing the velocity data points, so the
# physics-residual points concentrate near the interfaces (grounding line +
# calving front) where the flow structure is sharpest. The band within
# interface_band_km of the interfaces holds interface_density; the rest holds
# density. Per-region [grounded, floating] pairs (see
# ../ross_east_byrd.yaml and utils/collocation.py), sized so each region's
# total collocation count matches its own velocity-observation count exactly
# (8631 grounded / 105235 floating) while keeping the same core:interface
# 1:5 density ratio as before.
collocation:
  density: [3.40, 4.52]     # pts/km^2 (grounded, floating)
  interface_density: [17.00, 22.58]  # pts/km^2 within interface_band_km of the interfaces
  interface_band_km: 5      # half-width (km) of the near-interface band
