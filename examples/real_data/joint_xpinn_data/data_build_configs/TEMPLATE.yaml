# Template for a joint_xpinn_data config. Copy this file, rename it, and edit —
# every field except the first three is optional and falls back to
# PipelineConfig's own default if omitted (see ../config.py).
#
# Build with:
#   python -m joint_xpinn_data.build_dataset joint_xpinn_data/configs/<your_file>.yaml
#
# Or build every config in this directory at once:
#   python -m joint_xpinn_data.build_dataset joint_xpinn_data/configs/

# --- Required: which shelf, which grounding zone, how far upstream ---

# Exact name from Antarctic-boundaries/data/iceshelves_2008_v2.mat.
# Check spelling with: boundaries.list_names(str(DEFAULT_PATHS["iceshelves"]))
ice_shelf: Amery

# Exact name from Antarctic-boundaries/data/basins_refined_v2.mat. This is
# tributary-glacier granularity (e.g. Amery is fed by Lambert, Mellor,
# AND Fisher as separate basins) — pick the one tributary you want as the
# grounded region.
grounding_zone: Lambert

# How far upstream of the grounding line the grounded region extends.
buffer_km: 100

# --- Optional: data sources (defaults shown below are the currently
# recommended ones — see data_sources/*.py module docstrings for the
# tradeoffs of each alternative and *_SOURCES for the full registry) ---

# velocity_source: measures_v2          # or: custom_xy
# dense_thickness_source: bedmachine_v3 # or: bedmap1_csv, bedmap2_csv, concat, custom_xy
# sparse_thickness_source: bedmap1_csv  # or: bedmachine_v3, bedmap2_csv, concat, custom_xy
# dense_surface_source: bedmachine_v3   # or: bedmap1_csv, custom_xy
# sparse_surface_source: bedmap1_csv    # or: bedmachine_v3, custom_xy
# grounding_line_source: measures_boundaries_2008  # or: bedmachine_mask, custom_xy
# calving_front_source: bedmachine_mask # or: antarctic_boundaries_mask, velocity_mask, measures_boundaries_2008, custom_xy
# floating_region_source: whole_shelf   # or: flowline_corridor, basin_partition

# `whole_shelf` (default) is the named ice shelf's full extent minus the
# grounded corridor, regardless of buffer_km/grounding_zone — fine for a
# moderate shelf fed by a few tributaries (Amery). For a shelf as large
# as Ross East, fed by many outlet glaciers, restrict the floating region
# to just grounding_zone's own flow instead: flowline_corridor traces
# forward streamlines from only this basin's flux-gate seeds (cheap);
# basin_partition runs the full multi-basin nearest-neighbor competition
# (more principled, more expensive) — see floating_region.py. Both
# require margin_km (how far beyond the traced flow to keep, km).
# flowline_corridor also tapers its buffer radius from min_margin_km
# (default 2.0) at the grounding line up to the full margin_km over
# taper_km (default: margin_km) of downstream distance, rather than
# jumping straight to a uniform margin_km-wide band — a sharp,
# unphysical discontinuity right at the grounded/floating transition
# otherwise. min_normal_velocity_myr (default 0.0 = any positive inflow)
# should match region_strategy_kwargs.min_speed_myr below if you set
# that — otherwise the corridor's own seeds can span a much wider
# interface than the (flow-filtered) reported grounding line does, and
# the corridor starts just as wide immediately regardless of the taper
# (confirmed for Byrd/Ross East — see ../HANDOFF.md). Leave it unset if
# you're also using region_strategy: flow_restricted below —
# process_flow_restricted derives it from min_speed_myr automatically so
# the two can't drift out of sync:
# floating_region_source: flowline_corridor
# floating_region_kwargs:
#   margin_km: 15.0

# `concat` (thickness only, any role) merges multiple named sources of
# the same kind into one PointObservations, e.g. filling BEDMAP1's real
# coverage gaps with BEDMAP2's PCMEGA survey rather than being stuck with
# whichever single source a role is bound to:
# sparse_thickness_source: concat
# sparse_thickness_kwargs:
#   sources:
#     - source: bedmap1_csv
#     - source: bedmap2_csv

# Drop grounded-region velocity points (and xd/yd/ud/vd, xcol/ycol,
# h_dense/s_dense, ols_d derived from them) at or below this speed —
# excludes near-stagnant ice (e.g. near an ice divide) from the grounded
# region's training data. None/omitted = no filtering. Floating-region
# points are never filtered this way.
# grounded_min_speed_myr: 100.0

# Which domain.REGION_STRATEGIES entry builds the grounded/floating
# geometry. "simple" (default, omit both fields below) = no GL
# flow-filtering, no velocity-thresholded grounded corridor — the common
# case (Amery's three configs all use it). "flow_restricted" opts into
# both, via region_strategy_kwargs:
#   min_speed_myr (required): drop grounding-line points (x_md/y_md, and
#     everywhere else the GL flows through — corridor buffer, cut
#     boundary, ols_d) where real velocity data shows at or below this
#     speed. A basin's own geometric downstream boundary can be much
#     wider than just the named glacier's fast trunk — e.g. Byrd's basin
#     interface with Ross East is ~76km wide (real speeds 2-832 m/yr,
#     median only 170) but 500.0 isolates a single ~20km segment matching
#     the glacier's real known width. See domain._filter_gl_by_flow.
#   corridor_margin_km (optional): also constrains the grounded region's
#     width near the interface to roughly this many km beyond the
#     flow-filtered grounding line's own extent (oriented via real
#     velocity direction — see domain._grounded_corridor). Needed because
#     grounded_polygon = buffer(gl, buffer_km) intersect basin_polygon
#     can stay however wide basin_polygon itself is near the coast
#     regardless of gl's own width — confirmed for Byrd: stayed
#     ~100-140km wide even after min_speed_myr narrowed gl to ~20km,
#     since buffer_km=100 is generous enough that basin_polygon's own
#     shape dominates the intersection either way. Match to the floating
#     corridor's own margin_km for a consistent width at the seam.
#     Omitted = no constraint.
# The strategy also uses min_speed_myr as floating_region_kwargs' own
# min_normal_velocity_myr default (above), so the two never need to be
# set separately. See docs/adr/0002-shelf-class-region-strategy-registry.md.
# region_strategy: flow_restricted
# region_strategy_kwargs:
#   min_speed_myr: 500.0
#   corridor_margin_km: 15.0

# Artificially resample the grounding line to this arc-length spacing (m)
# before it's used anywhere (corridor buffer, cut boundary, ols_d,
# x_md/y_md) — controls point resolution independent of the source's
# native vertex spacing (e.g. measures_boundaries_2008's ~54-point
# Lambert segment). None/omitted = keep native spacing. Intended for an
# ordered-polyline GL source (measures_boundaries_2008, all three Amery
# configs use 500.0). Using it with a mask-based unordered pixel-scatter
# source (bedmachine_mask) triggers a loud warning and a counterclockwise
# reordering heuristic instead of a hard failure — see
# utils/geometry_utils.resample_geometry/order_counterclockwise.
# grounding_line_resample_m: 500.0

# Collocation library (xcol/ycol) — the pool of physics-residual points
# DIFFICE_jax samples from at train time. Omitted (default) = the velocity
# data points (xcol/ycol = xd/yd), so library size is tied to data density.
# Set this block to decouple them: an independent, density-controlled
# two-tier low-discrepancy (Halton) sample inside each region, denser near
# the interfaces. `density` is required; `interface_density` defaults to
# `density` (no boost) and `interface_band_km` to 10. The band (within
# interface_band_km of the grounding line, plus the calving front for the
# floating region) holds exactly interface_density; the rest holds density.
# Deterministic — no seed needed. See utils/collocation.py.
# collocation:
#   density: 0.5            # pts/km^2 over the whole region
#   interface_density: 2.0  # pts/km^2 within interface_band_km of the interfaces
#   interface_band_km: 10   # half-width (km) of that band

# --- Optional: per-source tuning knobs, forwarded verbatim to the chosen
# provider function (see its signature for what it accepts) ---

# grounding_line_kwargs:
#   tol_km: 10.0
# calving_front_kwargs:
#   pad_km: 20.0
# velocity_kwargs: {}
# dense_thickness_kwargs: {}
# sparse_thickness_kwargs: {}
# dense_surface_kwargs: {}
# sparse_surface_kwargs: {}

# --- Optional: override specific file paths (rare — only needed if
# pointing at a different version of a dataset, e.g. BedMachine v4
# instead of v3). Only the keys you list here are overridden; everything
# else still comes from DEFAULT_PATHS. To relocate the whole data root to
# another machine, set the DIFFICE_DATA_ROOT environment variable instead
# (config.py reads it); use `paths:` only for per-file overrides. ---

# paths:
#   bedmachine: /path/to/Data/BedMachineAntarctica-v4.nc  # literal path; not env-expanded
